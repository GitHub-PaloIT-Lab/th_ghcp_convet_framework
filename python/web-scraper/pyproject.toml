[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_system"

[project]
name = "web-scraper"
version = "1.0.0"
description = "Web scraping tool with multiple export formats"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "lxml>=4.9.0",
    "pandas>=2.1.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "ruff>=0.0.285",
]

[project.scripts]
scraper = "web_scraper.cli:main"
