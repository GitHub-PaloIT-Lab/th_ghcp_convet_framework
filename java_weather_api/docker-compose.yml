version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: weather-api-postgres
    environment:
      POSTGRES_USER: weather_user
      POSTGRES_PASSWORD: weather_password
      POSTGRES_DB: weather_api_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U weather_user -d weather_api_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - weather-api-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: weather-api-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - weather-api-network
    command: redis-server --appendonly yes

  # Spring Boot Application (optional, for local development)
  # weather-api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: weather-api-app
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     SPRING_PROFILES_ACTIVE: docker
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/weather_api_db
  #     SPRING_DATASOURCE_USERNAME: weather_user
  #     SPRING_DATASOURCE_PASSWORD: weather_password
  #     SPRING_REDIS_HOST: redis
  #     SPRING_REDIS_PORT: 6379
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - weather-api-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  weather-api-network:
    driver: bridge
