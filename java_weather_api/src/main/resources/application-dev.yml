spring:
  # PostgreSQL Development Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/weather_api_db
    username: weather_user
    password: weather_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  
  # Redis Development Configuration
  redis:
    host: localhost
    port: 6379
    password: # No password in development
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

# Logging Configuration (verbose for development)
logging:
  level:
    root: INFO
    com.weatherapi: DEBUG
    org.springframework.web: DEBUG
    org.springframework.data: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Actuator Configuration (all endpoints enabled in dev)
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      show-components: always

# API Configuration
api:
  weatherapi:
    enabled: true
    timeout: 30000
    base-url: https://api.weatherapi.com/v1
    key: ${WEATHERAPI_KEY:dev-key-placeholder}
  
  openweather:
    enabled: true
    timeout: 30000
    base-url: https://api.openweathermap.org/data/2.5
    key: ${OPENWEATHER_KEY:dev-key-placeholder}
