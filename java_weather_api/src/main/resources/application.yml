spring:
  application:
    name: weather-api
  
  # JPA/Database Configuration
  jpa:
    hibernate:
      ddl-auto: validate # Use Flyway for migrations, not Hibernate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  
  # Flyway Database Migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  # Datasource (will be overridden by profile-specific config)
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  
  # Redis Cache Configuration
  redis:
    timeout: 10000ms
    lettuce:
      pool:
        max-active: 10
        max-idle: 5
        min-idle: 1
        max-wait: -1ms
    database: 0
  
  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 3600000 # 1 hour in milliseconds
  
  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# Logging Configuration
logging:
  level:
    root: INFO
    com.weatherapi: DEBUG
    org.springframework.web: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true

# Custom API Configuration (will be loaded by @ConfigurationProperties)
api:
  weatherapi:
    enabled: true
    timeout: 30000 # 30 seconds
    base-url: https://api.weatherapi.com/v1
    # key: ${WEATHERAPI_KEY} # Load from environment variable
  
  openweather:
    enabled: true
    timeout: 30000 # 30 seconds
    base-url: https://api.openweathermap.org/data/2.5
    # key: ${OPENWEATHER_KEY} # Load from environment variable

# Cache Configuration
cache:
  weather:
    ttl: 3600 # 1 hour in seconds
  favorites:
    ttl: 86400 # 24 hours in seconds
