spring:
  profiles:
    active: prod
  
  # PostgreSQL Production Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/weather_api_db}
    username: ${SPRING_DATASOURCE_USERNAME:weather_user}
    password: ${SPRING_DATASOURCE_PASSWORD:weather_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
      leak-detection-threshold: 15000
  
  # Redis Production Configuration
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:}
    timeout: 10000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: -1ms
      shutdown-timeout: 2000ms
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate # Never change schema in production!
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
          fetch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false

# Logging Configuration (minimal for production)
logging:
  level:
    root: WARN
    com.weatherapi: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/weather-api.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 1GB

# Actuator Configuration (limited in production)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# API Configuration (from environment variables)
api:
  weatherapi:
    enabled: ${API_WEATHERAPI_ENABLED:true}
    timeout: 30000
    base-url: ${API_WEATHERAPI_BASE_URL:https://api.weatherapi.com/v1}
    key: ${API_WEATHERAPI_KEY:}
  
  openweather:
    enabled: ${API_OPENWEATHER_ENABLED:true}
    timeout: 30000
    base-url: ${API_OPENWEATHER_BASE_URL:https://api.openweathermap.org/data/2.5}
    key: ${API_OPENWEATHER_KEY:}

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false
